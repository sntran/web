name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The oldest versions that the package accepts, and the newest ones.
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20"
            otp: "29"
            newest: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-deps-

      - name: Restore WPT cache
        uses: actions/cache@v4
        with:
          path: tmp/wpt_cache
          key: ${{ runner.os }}-wpt-cache-${{ hashFiles('test/support/wpt.ex') }}

      - name: Install dependencies
        run: mix deps.get

      # The format can be different between two versions of Elixir.
      - name: Check formatting
        if: matrix.newest
        run: mix format --check-formatted

      - name: Static analysis
        run: mix credo --strict

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Test
        if: ${{ !matrix.newest }}
        run: mix test --warnings-as-errors

      - name: Test and coverage
        if: matrix.newest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mix coveralls.github
